# Ramaria v1.2 默认配置模板
#
# 使用说明:
# - 将此文件复制到 %APPDATA%\Ramaria\config.toml 后编辑
# - 所有配置项均有合理默认值，无需全部修改
# - API Key 不在此文件中配置，使用 OS keychain 管理
# - 环境变量优先级高于此文件
# - 修改后重启 Ramaria 生效

# 版本控制（请勿手动修改）
version = "1.6.0"
schema_version = 1

# =========================================================
# 路径配置
# =========================================================
# 所有路径均可留空，留空时使用平台默认值:
#   Windows: %APPDATA%\Ramaria\
# 可通过环境变量 RAMARIA_DATA_DIR 覆盖数据根目录

[paths]
# SQLite 数据库路径。默认 %APPDATA%\Ramaria\data\assistant.db
data_dir = ""
# 配置文件目录。默认 %APPDATA%\Ramaria\
config_dir = ""
# 日志目录。默认 %APPDATA%\Ramaria\logs\
log_dir = ""
# 向量索引目录。默认 %APPDATA%\Ramaria\vectors\
vector_index_dir = ""

# =========================================================
# LLM 后端配置
# =========================================================
# provider 可选: lm-studio / deepseek / openai
# 线上 provider 的 API Key 通过 OS keychain 管理，不在此处填写

[backend]
# 当前 LLM 后端
provider = "lm-studio"
# 模型标识（LM Studio 留空自动检测，DeepSeek 填 "deepseek-chat"）
model_id = ""
# OpenAI-compatible API 基础地址
# LM Studio 默认: http://localhost:1234/v1
# DeepSeek 默认: https://api.deepseek.com/v1
# OpenAI 默认: https://api.openai.com/v1
base_url = "http://localhost:1234/v1"
# Embedding 模型标识（可选，未配置时降级为 BM25-only）
# embedding_model_id = "bge-small-zh-v1.5"
# 生成温度 (0.0-2.0)，越高越随机
temperature = 0.3
# 最大输出 token 数
max_tokens = 1024
# 是否允许线上后端注入 L1/L2/L3 记忆上下文
# true = 对话时附带相关记忆（首次使用线上 API 需隐私确认）
# false = 仅发送当前对话消息
online_memory_injection = true

# =========================================================
# 嵌入模型运行时配置
# =========================================================
# 控制原生 safetensors 嵌入编码器的计算设备（candle 推理引擎）。
# device 可选: cpu / cuda / auto
#   cpu  = 强制 CPU 推理（最保守）
#   cuda = 强制 CUDA GPU（RTX 4060 等），不可用时静默回退 CPU
#   auto = 自动探测：CUDA 可用则用 GPU，否则 CPU
# 注意: cuda 需要编译时启用 cuda feature（Cargo.toml 的 ramaria-llm cuda feature）。
# 设备选择不改变向量语义，仅影响推理性能（GPU 单块可从分钟级压到 <100ms）。

[embedding]
device = "auto"

# =========================================================
# 记忆检索参数
# =========================================================
# 控制混合 RAG 三通道（向量/BM25/图谱）的检索行为

[retrieval]
# L0 滑动窗口大小（每次检索包含最近 N 条消息）
l0_window_size = 3
# L0 检索返回条数
l0_retrieve_top_k = 3
# L1 摘要检索返回条数
l1_retrieve_top_k = 4
# L2 事件检索返回条数
l2_retrieve_top_k = 2
# 语义相似度过滤阈值（余弦距离，低于此值视为不相关被过滤）
similarity_threshold = 0.6
# RRF 融合平滑系数（值越大各通道权重越平均）
rrf_k = 60
# BM25 关键词通道权重
bm25_weight = 1.0
# 知识图谱通道权重
graph_weight = 0.8
# L2 结果排序权重（<1.0 表示 L2 优先展示）
retrieval_weight_l2 = 0.8
# L1 结果排序权重
retrieval_weight_l1 = 1.0

# =========================================================
# Ebbinghaus 遗忘曲线衰减参数
# =========================================================
# 记忆的检索权重随时间衰减，但受显著性（salience）调制
# 衰减公式: R = e^(-t / S)
#   R = 保留率 0..1
#   t = 距生成的天数
#   S = 稳定性系数，越大衰减越慢
# S_adjusted = S × (1 + salience × multiplier)

[decay]
# L0 稳定性系数（细节信息衰减最快）
s_l0 = 10
# L1 稳定性系数
s_l1 = 30
# L2 稳定性系数（聚合摘要衰减最慢）
s_l2 = 60
# 是否启用近期访问加成
enable_access_boost = true
# 近期访问加成有效天数
recent_boost_days = 7
# 近期访问保留率下限（加成后不低于此值）
recent_boost_floor = 0.5
# salience 对稳定性的加成系数
salience_multiplier = 0.5

# =========================================================
# Session 生命周期管理
# =========================================================
# 控制会话的自动关闭和记忆管线触发节奏

[session]
# 空闲超过此时长（分钟）自动关闭 session 并触发 L1 摘要
l1_idle_minutes = 10
# 空闲检测轮询间隔（秒）
idle_check_interval_seconds = 60
# L2/L3 定时检查间隔（秒）
l2_check_interval_seconds = 86400
# 对话历史最大保留消息数（供 System Prompt 上下文使用）
max_history_messages = 40

# =========================================================
# 记忆层触发阈值
# =========================================================
# 控制 L1→L2 事件提取和 L2→L3 性格推断的自动触发条件
# 双路径设计: 路径 A = 数量触发（即时），路径 B = 时间触发（定时）

[thresholds]
# 未吸收 L1 触发 L2 事件提取的条数阈值（路径 A）
l2_trigger_count = 5
# 最早未吸收 L1 触发 L2 的天数阈值（路径 B）
l2_trigger_days = 7
# 未吸收事件触发 L3 性格推断的条数阈值（路径 A）
l3_trigger_count = 10
# 最早未吸收事件触发 L3 推断的天数阈值（路径 B）
l3_trigger_days = 30
# L2 簇间 LLM 请求间隔（毫秒），0=不等待；对 DeepSeek 等有速率限制的 API 建议设为 500~1000
cluster_delay_ms = 800

# =========================================================
# 索引管理
# =========================================================

[index]
# BM25 增量合并阈值（缓冲区积累超过此条数触发合并）
bm25_incremental_threshold = 10
# BM25 定时重建检查间隔（秒）
bm25_rebuild_interval = 300

# =========================================================
# L3 性格推断 LLM 参数（Phase B/C）
# =========================================================
# 控制 L3 三步推断（Few-shot 基线 → 事件驱动更新 → 置信度校准）的 LLM 行为。

[inference.inferrer]
# LLM 生成温度
temperature = 0.3
# Phase B 推断最大输出 token
max_tokens = 2048
# 小样本分类的证据阈值
low_evidence_threshold = 5.0
# 每步最大 tokens
step_max_tokens = 2048

# =========================================================
# 画像升级
# =========================================================
# 画像升级四个增量的独立开关；全部关闭时画像输出回退旧版行为。

[inference.upgrade]
# 跨版本簇匹配阈值使用 0.85；false = 回退旧值 0.75
cross_version_threshold_085 = true
# 冷启动先验使用跨用户经验分布；false = 回退当前 persona 内先验
cold_start_cross_user_prior = true
# 漂移检测从 persona_cluster_snapshots 恢复真实旧分布；false = 回退硬编码占位
drift_restore_real_distribution = true

# =========================================================
# L2 事件提取 LLM 参数
# =========================================================
# 事件提取的输出是长 JSON（含多个事件的 title/summary/keywords/motives 等），
# 需要比对话大得多的 token 预算。截断将导致 JSON 不完整 → 降级。
# DeepSeek 建议 4096-8192，本地模型按实际能力调整。

[event_extraction]
# LLM 生成温度
temperature = 0.3
# 最大输出 token（事件 JSON 较长，默认 4096。截断会导致降级）
max_tokens = 8192
# 单簇最多提取的事件数
max_events = 5
# 降级事件动态置信度公式：min(0.59, 0.35 + 0.02 × n_l1)
# 封顶 0.59 恒处 tentative；false = 回退固定 0.5
degraded_confidence_enabled = true

# =========================================================
# 日志
# =========================================================
# 日志文件位于 log_dir/ramaria.log
# 默认不记录完整用户消息、记忆内容、Prompt 内容
# 用户消息截断前 80 字符并附 SHA-256 哈希值

[logging]
# 是否记录完整 Prompt（默认关闭，开启时会有隐私警告）
# ⚠ 仅用于调试，包含你的对话内容和系统提示，调试完成后请关闭
log_full_prompt = false

# =========================================================
# utt 话语块配置
# =========================================================
# 原文话语块通道：会话消息按时间间隙/条数上限切分为块，
# 对话时检索注入【原文片段】，使回复复现 persona 原话与口癖。
# 原文是最高敏感层：默认仅角色类 persona 开启，原文不写日志。

[utt]
# 是否启用 utt 话语块全链路（false = 不注入原文）
enabled = true
# 时间间隙阈值（分钟）：相邻消息间隔超过此值切分为新块
# 10 分钟为窄切分（更细粒度分块），实证为各候选档位最优
theta_gap_minutes = 10
# 单块最大消息条数：超过此条数强制切分
# 80 条上限（更大块、更少切分），实证与 40 条无显著差异
max_msgs_per_block = 80
# 对话时检索返回的 utt 块数量（top_k）
# 3 路检索（top_k=1 显著劣化，保留 3）
retrieve_top_k = 3
# 原文片段注入的字符预算上限（所有块合计，超预算按相似度丢整块）
max_block_chars = 1500
# 原文注入的 persona 类型白名单（助手/系统类不注入原文）
persona_kind_whitelist = ["char", "anim", "oc", "hist"]

# =========================================================
# examples 配置
# =========================================================
# Few-shot 示例激活：会话关闭时自动抽取"对方 → 你"回复对入库，
# 注入时按话题/情绪/长度评分轮换，检索未命中时作风格兜底。

[examples]
# 是否启用 examples 写侧激活（false = 不加载示例）
enabled = true
# 注入时的最大示例条数
max_examples = 5

# =========================================================
# 桥接配置
# =========================================================
# 跨会话桥接：新会话创建时加载最近一个已关闭会话的尾部原文，
# 隔天回来能接上上次聊的。桥接内容受原文白名单约束。

[bridge]
# 是否启用桥接（false = 不加载）
enabled = true
# 桥接内容字符预算上限（超限从头部截断、保最近）
max_chars = 800

# =========================================================
# 三层生成缓存
# =========================================================

[cache]
# 精确缓存总开关（false = LLM 调用不查询/不写入缓存）
enabled = true
# llm_response_cache 表容量上限（条目数），超出按 eviction 策略淘汰最旧条目
max_entries = 10000
# 淘汰策略：lru（最近最少使用）| fifo（先入先出）
eviction = "lru"
# L2 聚类去重指纹开关（false = 不做同集合跳过与相似度去重）
l2_fingerprint_enabled = true
# 新提取事件与已有事件相似度去重的判定阈值（0.0~1.0，>= 阈值判为重复）
l2_similarity_threshold = 0.95
# 相似度去重比对的最远事件条数（取 persona 最近 N 条）
l2_recent_events_limit = 200

# =========================================================
# 行为模型学习与驱动
# =========================================================
# 行为层：persona 的反应模式自动复现（事件 → 聚类 → 规则生成 → 情境路由）。
# 参数按初值推进并标注「待实证」（聚类参数定稿后回填）。

[behavior]
# 行为层总开关（false = 不学习/不路由）
enabled = true
# 密度聚类邻域相似度阈值 θ_nb：样本对相似度 ≥ 该值视为邻居
theta_nb = 0.65
# 核心样本最小邻居数 min_cluster_size（默认 3）
min_cluster_size = 3
# 增量归簇阈值 θ_join（默认 0.7）
theta_join = 0.7
# 反应通道权重 β1（默认 0.85，主导 paraphrase⊕attitude 语义；约束 β1+β2≤1，
# 关键词权重 β3=1−β1−β2=0.05）
beta1 = 0.85
# 情境通道权重 β2（默认 0.10，情境关键词参与比对）
beta2 = 0.10
# 情境路由阈值 θ_route（默认 0.6，全部候选低于此值 → 不注入，静默降级）
theta_route = 0.6
# 路由评分 cos 项权重 γ（默认 0.7）
gamma = 0.7
# 路由 Top-N 合并上限（主规则完整注入 + 次规则仅合并 avoid/params）
top_n = 3
# 规则文本生成的证据量门槛（默认 5）
min_evidence = 5
# 有效样本量门槛 n_eff（默认 5）
min_n_eff = 5
# 簇内 valence 标准差上限（默认 0.5，超限视为反应倾向不一致 → 降级候选规则）
valence_std_limit = 0.5
# 聚类孤立点比例上限（默认 0.6，超限触发失败模式检查：下调 θ_nb 重试）
max_outlier_ratio = 0.6
# 待定池样本过期天数（默认 30，超期未成簇 → 低置信标记，不参与规则生成）
pending_expire_days = 30
# 规则证据衰减保留率下限（默认 0.3，低于 → 降级/失效）
evidence_decay_threshold = 0.3
# 行为层近期事件加权窗口（天）：窗口内事件 recency_factor=1.0，之后指数衰减
recent_days = 30

# =========================================================
# 知识层
# =========================================================
# 从事件自动抽取人物事实 → 判重/分层/版本链仲裁 → 判定器注入事实卡片。
# 总开关默认关闭：需用户显式开启才参与对话注入。

[knowledge]
# 自动事实检测总开关（默认 false，自动为主可配置；false → 不抽取不注入）
auto_fact_detect = false
# 规则判定器开关（零新增 LLM 调用；false = 不检索注入）
detector_enabled = true
# 判重语义余弦阈值（同 field 语义 ≥0.85 且关键词交集 ≥1 → 判重复）
dedup_cosine_threshold = 0.85
# 判重关键词交集下限（≥1 个共同词参与判重）
dedup_keyword_min = 1
# 多事件互证语义余弦阈值（≥2 独立事件且语义 ≥0.7 且 valence 一致 → 覆盖）
corroboration_cosine_threshold = 0.7
# 事实卡片注入预算（字符上限，超预算保前部）
injection_budget_chars = 800
# 动态事实（volatile）时效半衰期（天，随事件时间衰减）
volatile_halflife_days = 30

# =========================================================
# 杂项（预留扩展位）
# =========================================================

[misc]
# 当前无配置项，为未来扩展预留
