# Ramaria 默认配置模板
#
# 使用说明:
# - 将此文件复制到 %APPDATA%\Ramaria\config.toml 后编辑
# - 所有配置项均有合理默认值，无需全部修改
# - API Key 不在此文件中配置，使用 OS keychain 管理
# - 环境变量优先级高于此文件
# - 修改后重启 Ramaria 生效

# 版本控制（请勿手动修改）
version = "2.5.0"
schema_version = 1

# =========================================================
# 路径配置
# =========================================================
# 所有路径均可留空，留空时使用平台默认值:
#   Windows: %APPDATA%\Ramaria\
# 可通过环境变量 RAMARIA_DATA_DIR 覆盖数据根目录

[paths]
# SQLite 数据库路径。默认 %APPDATA%\Ramaria\data\assistant.db
data_dir = ""
# 配置文件目录。默认 %APPDATA%\Ramaria\
config_dir = ""
# 日志目录。默认 %APPDATA%\Ramaria\logs\
log_dir = ""
# 向量索引目录。默认 %APPDATA%\Ramaria\vectors\
vector_index_dir = ""

# =========================================================
# LLM 后端配置
# =========================================================
# provider 可选: lm-studio / deepseek / openai
# 线上 provider 的 API Key 通过 OS keychain 管理，不在此处填写

[backend]
# 当前 LLM 后端
provider = "lm-studio"
# 模型标识（LM Studio 留空自动检测，DeepSeek 填 "deepseek-chat"）
model_id = ""
# OpenAI-compatible API 基础地址
# LM Studio 默认: http://localhost:1234/v1
# DeepSeek 默认: https://api.deepseek.com/v1
# OpenAI 默认: https://api.openai.com/v1
base_url = "http://localhost:1234/v1"
# Embedding 模型标识（可选，未配置时降级为 BM25-only）
# embedding_model_id = "bge-small-zh-v1.5"
# 生成温度 (0.0-2.0)，越高越随机
temperature = 0.3
# 最大输出 token 数
max_tokens = 1024
# 是否允许线上后端注入 L1/L2/L3 记忆上下文
# true = 对话时附带相关记忆（首次使用线上 API 需隐私确认）
# false = 仅发送当前对话消息
online_memory_injection = true

# =========================================================
# 嵌入模型运行时配置
# =========================================================
# 控制原生 safetensors 嵌入编码器的计算设备（candle 推理引擎）。
# device 可选: cpu / cuda / auto
#   cpu  = 强制 CPU 推理（最保守）
#   cuda = 强制 CUDA GPU（RTX 4060 等），不可用时静默回退 CPU
#   auto = 自动探测：CUDA 可用则用 GPU，否则 CPU
# 注意: cuda 需要编译时启用 cuda feature（Cargo.toml 的 ramaria-llm cuda feature）。
# 设备选择不改变向量语义，仅影响推理性能（GPU 单块可从分钟级压到 <100ms）。

[embedding]
device = "auto"

# =========================================================
# 记忆检索参数（memory_rag 摘要路专属）
# =========================================================
# 控制混合 RAG 三通道（向量/BM25/图谱）的检索行为，
# 并承载摘要路 Persona-Aware RAG 的上下文格式化参数（rag_*）。
# 本组为摘要路（L1/L2 记忆摘要检索 + RRF 融合）的独立参数；
# 原文样例路（[utt]）与知识路（[knowledge]）各有自己的检索参数，
# 三路独立调参互不串扰（阶段一维持 v1.7 等价，参数定稿在后续阶段）。

[retrieval]
# L0 滑动窗口大小（每次检索包含最近 N 条消息）
l0_window_size = 3
# L0 检索返回条数
l0_retrieve_top_k = 3
# L1 摘要检索返回条数
l1_retrieve_top_k = 4
# L2 事件检索返回条数
l2_retrieve_top_k = 2
# 语义相似度过滤阈值（余弦距离，低于此值视为不相关被过滤）
similarity_threshold = 0.6
# RRF 融合平滑系数（值越大各通道权重越平均）
rrf_k = 60
# BM25 关键词通道权重
bm25_weight = 1.0
# 知识图谱通道权重
graph_weight = 0.8
# 图谱通道开关（摘要路三通道之一）：false = 回退 BM25 + 向量（+ 关键词镜像）
enable_graph = true
# 向量通道开关（摘要路三通道之一）：false = 仅 BM25 + 图谱参与 RRF 融合
enable_vector = true
# 关键词镜像通道开关（摘要路第四通道）：false = 回退仅三通道（BM25 + 向量 + 图谱）
enable_keyword_channel = true
# 关键词镜像通道权重（参与 RRF 融合；1.0 = 与向量通道同权重）
keyword_weight = 1.0
# L2 结果排序权重（<1.0 表示 L2 优先展示）
retrieval_weight_l2 = 0.8
# L1 结果排序权重
retrieval_weight_l1 = 1.0
# 脉络加权注入（v1.7 B4）：跨会话近期摘要按"时间（衰减×访问加成）×话题相关性"融合排序
# false = 回退 v1.6 的"无条件取最近 N 条"
narrative_weighted = true
# 脉络注入的最大条数
narrative_top_k = 3
# ---- 摘要路 RAG 格式化参数（Persona-Aware 过滤 + 上下文格式；默认与既有行为等价）----
# 上下文最大记忆条目数
rag_max_memories = 5
# 单条记忆摘要的最大字符数
rag_max_summary_chars = 120
# Persona-Aware 过滤：user 类型最低 share 阈值
rag_share_threshold_user = 0.3
# Persona-Aware 过滤：char/anim/oc/hist 类型最低 share 阈值
rag_share_threshold_char = 0.5
# Persona-Aware 过滤：rama 类型最低 share 阈值（0.0 = 全量）
rag_share_threshold_rama = 0.0
# 上下文格式化是否包含图谱实体
rag_include_graph_entities = true

# =========================================================
# Ebbinghaus 遗忘曲线衰减参数
# =========================================================
# 记忆的检索权重随时间衰减，但受显著性（salience）调制
# 衰减公式: R = e^(-t / S)
#   R = 保留率 0..1
#   t = 距生成的天数
#   S = 稳定性系数，越大衰减越慢
# S_adjusted = S × (1 + salience × multiplier)

[decay]
# L0 稳定性系数（细节信息衰减最快）
s_l0 = 10
# L1 稳定性系数
s_l1 = 30
# L2 稳定性系数（聚合摘要衰减最慢）
s_l2 = 60
# 是否启用近期访问加成
enable_access_boost = true
# 近期访问加成有效天数
recent_boost_days = 7
# 近期访问保留率下限（加成后不低于此值）
recent_boost_floor = 0.5
# salience 对稳定性的加成系数
salience_multiplier = 0.5

# =========================================================
# Session 生命周期管理
# =========================================================
# 控制会话的自动关闭和记忆管线触发节奏

[session]
# 空闲超过此时长（分钟）自动关闭 session 并触发 L1 摘要
l1_idle_minutes = 10
# 空闲检测轮询间隔（秒）
idle_check_interval_seconds = 60
# L2/L3 定时检查间隔（秒）
l2_check_interval_seconds = 86400
# 对话历史加载条数上限（供 System Prompt 上下文使用；分页倒序加载）
max_history_messages = 200
# 对话历史字符预算上限（消息内容 + role 标记的粗略字符数；超限保留最近内容）
max_history_chars = 6000

# =========================================================
# 记忆层触发阈值
# =========================================================
# 控制 L1→L2 事件提取和 L2→L3 性格推断的自动触发条件
# 双路径设计: 路径 A = 数量触发（即时），路径 B = 时间触发（定时）

[thresholds]
# 未吸收 L1 触发 L2 事件提取的条数阈值（路径 A）
l2_trigger_count = 5
# 最早未吸收 L1 触发 L2 的天数阈值（路径 B）
l2_trigger_days = 7
# 未吸收事件触发 L3 性格推断的条数阈值（路径 A）
l3_trigger_count = 10
# 最早未吸收事件触发 L3 推断的天数阈值（路径 B）
l3_trigger_days = 30
# L2 簇间 LLM 请求间隔（毫秒），0=不等待；对 DeepSeek 等有速率限制的 API 建议设为 500~1000
cluster_delay_ms = 800

# =========================================================
# L1 渐进式摘要（B3）
# =========================================================
# 长会话（消息数 > msg_threshold 或跨度 > span_hours）在封存时按 tail_msg_count 切段、
# 全段生成：每段独立成 L1（absorbed=0 入候选池，L2 仍封存触发），尾段覆盖最新对话。
# 关闭时回退 v1.6 行为（整会话/按 utt 切分）。

[l1.progressive]
# 渐进式摘要总开关（默认 true）
enabled = true
# 消息数触发阈值（超过此值触发分段）
msg_threshold = 100
# 时间跨度触发阈值（小时，首末消息跨度超过此值触发分段）
span_hours = 24
# 单段最大消息条数（分段时每段不超过此值，尾段覆盖最新消息）
tail_msg_count = 60

# =========================================================
# 索引管理
# =========================================================

[index]
# BM25 增量合并阈值（缓冲区积累超过此条数触发合并）
bm25_incremental_threshold = 10
# BM25 定时重建检查间隔（秒）
bm25_rebuild_interval = 300
# 内存索引两次重建之间的最小间隔（秒）：
# 0 = 不节流（每次召回校验代次，其他进程写入即时可见）；
# 大于 0 时抑制写入密集期的重建风暴，代价是刷新延迟不超过该间隔
refresh_interval_seconds = 0

# =========================================================
# L3 性格推断 LLM 参数（Phase B/C）
# =========================================================
# 控制 L3 三步推断（Few-shot 基线 → 事件驱动更新 → 置信度校准）的 LLM 行为。

[inference.inferrer]
# LLM 生成温度
temperature = 0.3
# Phase B 推断最大输出 token
max_tokens = 2048
# 小样本分类的证据阈值
low_evidence_threshold = 5.0
# 每步最大 tokens
step_max_tokens = 2048

# =========================================================
# L3 Phase C 置信度更新
# =========================================================
# 证据累积式置信度：按 Ebbinghaus 曲线对 L2 事件衰减后累加，
# 并按时间保底衰减，避免长期未更新导致置信度虚高。

[inference.confidence]
# L2 层稳定性系数 S（天数，越大衰减越慢）
stability_s = 60.0
# 时间衰减保底值（衰减系数不会低于此值）
min_decay = 0.01

# =========================================================
# L3 Phase C 漂移检测
# =========================================================
# 新旧画像分布的 Wasserstein 漂移检验（置换检验）。
# 需 `[inference.upgrade].drift_restore_real_distribution = true` 才会从
# persona_cluster_snapshots 恢复真实旧分布并执行。

[inference.drift]
# 显著性水平
alpha = 0.05
# 置换检验次数
n_permutations = 1000

# =========================================================
# L3 全量校准触发
# =========================================================
# 满足任一条件触发定期全量校准（增量轮次 / 事件量翻倍），
# 校准差异超过告警比例时记录告警。

[inference.calibration]
# 增量更新轮次阈值
round_threshold = 10
# 事件量翻倍比例阈值（当前事件量 > 上次校准 × 此值）
event_doubling_ratio = 2.0
# 校准前后差异告警比例
diff_alert_ratio = 0.3

# =========================================================
# 画像升级
# =========================================================
# 画像升级四个增量的独立开关；全部关闭时画像输出回退旧版行为。

[inference.upgrade]
# 跨版本簇匹配阈值使用 0.85；false = 回退旧值 0.75
cross_version_threshold_085 = true
# 冷启动先验使用跨用户经验分布；false = 回退当前 persona 内先验
cold_start_cross_user_prior = true
# 漂移检测从 persona_cluster_snapshots 恢复真实旧分布并执行；false = 漂移检测整体显式跳过
drift_restore_real_distribution = true
# 因果链注入扩展段（时延分布 + 情绪沿链走势）；false = 回退 v1.7 仅链长/循环模式
causal_latency_emotion_trend = true

# =========================================================
# L2 事件提取 LLM 参数
# =========================================================
# 事件提取的输出是长 JSON（含多个事件的 title/summary/keywords/motives 等），
# 需要比对话大得多的 token 预算。截断将导致 JSON 不完整 → 降级。
# DeepSeek 建议 4096-8192，本地模型按实际能力调整。

[event_extraction]
# LLM 生成温度
temperature = 0.3
# 最大输出 token（事件 JSON 较长，默认 4096。截断会导致降级）
max_tokens = 8192
# 单簇最多提取的事件数
max_events = 5
# 降级事件动态置信度公式：min(0.59, 0.35 + 0.02 × n_l1)
# 封顶 0.59 恒处 tentative；false = 回退固定 0.5
degraded_confidence_enabled = true

# =========================================================
# 日志
# =========================================================
# 日志文件位于 log_dir/ramaria.log
# 默认不记录完整用户消息、记忆内容、Prompt 内容（只记录长度与请求元数据）

[logging]
# 完整 Prompt 记录开关（预留项：当前实现未接线，无论取值均不写完整 Prompt；
# 启用前需先明确隐私披露，且开启时应有隐私警告）
# ⚠ 完整 Prompt 含你的对话内容与系统提示
log_full_prompt = false

# =========================================================
# utt 话语块配置
# =========================================================
# 原文话语块通道：会话消息按时间间隙/条数上限切分为块，
# 对话时检索注入【原文片段】，使回复复现 persona 原话与口癖。
# 原文是最高敏感层：默认仅角色类 persona 开启，原文不写日志。
# 本组为原文样例路（utt）的专属切分/检索参数，与摘要路/知识路独立。

[utt]
# 是否启用 utt 话语块全链路（false = 不注入原文）
enabled = true
# 时间间隙阈值（分钟）：相邻消息间隔超过此值切分为新块
# 10 分钟为窄切分（更细粒度分块），实证为各候选档位最优
theta_gap_minutes = 10
# 单块最大消息条数：超过此条数强制切分
# 80 条上限（更大块、更少切分），实证与 40 条无显著差异
max_msgs_per_block = 80
# 对话时检索返回的 utt 块数量（top_k）
# 3 路检索（top_k=1 显著劣化，保留 3）
retrieve_top_k = 3
# 原文片段注入的字符预算上限（所有块合计，超预算按相似度丢整块）
max_block_chars = 1500
# 原文注入的 persona 类型白名单（助手/系统类不注入原文）
persona_kind_whitelist = ["char", "anim", "oc", "hist"]

# =========================================================
# examples 配置
# =========================================================
# Few-shot 示例激活：会话关闭时自动抽取"对方 → 你"回复对入库，
# 注入时按话题/情绪/长度评分轮换，检索未命中时作风格兜底。

[examples]
# 是否启用 examples 写侧激活（false = 不加载示例）
enabled = true
# 注入时的最大示例条数
max_examples = 5

# =========================================================
# 桥接配置
# =========================================================
# 跨会话桥接：新会话创建时加载最近一个已关闭会话的尾部原文，
# 隔天回来能接上上次聊的。桥接内容受原文白名单约束。

[bridge]
# 是否启用桥接（false = 不加载）
enabled = true
# 桥接内容字符预算上限（超限从头部截断、保最近）
max_chars = 800

# =========================================================
# 三层生成缓存
# =========================================================

[cache]
# 精确缓存总开关（false = LLM 调用不查询/不写入缓存）
enabled = true
# llm_response_cache 表容量上限（条目数），超出按 eviction 策略淘汰最旧条目
max_entries = 10000
# 淘汰策略：lru（最近最少使用）| fifo（先入先出）
eviction = "lru"
# L2 聚类去重指纹开关（false = 不做同集合跳过与相似度去重）
l2_fingerprint_enabled = true
# 新提取事件与已有事件相似度去重的判定阈值（0.0~1.0，>= 阈值判为重复）
l2_similarity_threshold = 0.95
# 相似度去重比对的最远事件条数（取 persona 最近 N 条）
l2_recent_events_limit = 200

# =========================================================
# 行为模型学习与驱动
# =========================================================
# 行为层：persona 的反应模式自动复现（事件 → 聚类 → 规则生成 → 情境路由）。
# 参数按初值推进并标注「待实证」（聚类参数定稿后回填）。

[behavior]
# 行为层总开关（false = 不学习/不路由）
enabled = true
# 密度聚类邻域相似度阈值 θ_nb：样本对相似度 ≥ 该值视为邻居
theta_nb = 0.65
# 核心样本最小邻居数 min_cluster_size（默认 3）
min_cluster_size = 3
# 增量归簇阈值 θ_join（默认 0.7）
theta_join = 0.7
# 反应通道权重 β1（默认 0.85，主导 paraphrase⊕attitude 语义；约束 β1+β2≤1，
# 关键词权重 β3=1−β1−β2=0.05）
beta1 = 0.85
# 情境通道权重 β2（默认 0.10，情境关键词参与比对）
beta2 = 0.10
# 情境路由阈值 θ_route（默认 0.6，全部候选低于此值 → 不注入，静默降级）
theta_route = 0.6
# 路由评分 cos 项权重 γ（默认 0.7）
gamma = 0.7
# 路由 Top-N 合并上限（主规则完整注入 + 次规则仅合并 avoid/params）
top_n = 3
# 规则文本生成的证据量门槛（默认 5）
min_evidence = 5
# 有效样本量门槛 n_eff（默认 5）
min_n_eff = 5
# 簇内 valence 标准差上限（默认 0.5，超限视为反应倾向不一致 → 降级候选规则）
valence_std_limit = 0.5
# 聚类孤立点比例上限（默认 0.6，超限触发失败模式检查：下调 θ_nb 重试）
max_outlier_ratio = 0.6
# 待定池样本过期天数（默认 30，超期未成簇 → 低置信标记，不参与规则生成）
pending_expire_days = 30
# 规则证据衰减保留率下限（默认 0.3，低于 → 降级/失效）
evidence_decay_threshold = 0.3
# 行为层近期事件加权窗口（天）：窗口内事件 recency_factor=1.0，之后指数衰减
recent_days = 30

# =========================================================
# 知识层
# =========================================================
# 从事件自动抽取人物事实 → 判重/分层/版本链仲裁 → 判定器注入事实卡片。
# 总开关默认关闭：需用户显式开启才参与对话注入。

[knowledge]
# 自动事实检测总开关（默认 false，false → 不抽取、不注入，与上一版本完全一致）。
# 开启后抽取走常规轨道（客观/混合达标事件）+ 增强轨道（主观/低置信事件字段感知隐含、
# L1 保真线索→断言、低置信候选互证提升），作为召回的兜底而非主力。
auto_fact_detect = false
# 规则判定器开关（零新增 LLM 调用；false = 不检索注入）
detector_enabled = true
# ---- 知识 fact 路独立检索参数（本路独立，阶段一维持 v1.7 等价，M8 定稿）----
# 候选事实检索条数上限：0 = 与 v1.7 等价（不按条数截断，仅按预算注入）
retrieve_top_k = 0
# 候选检索路由阈值（θ_route）：0.0 = 与 v1.7 等价（沿用既有判定口径）
retrieve_threshold = 0.0
# 判重语义余弦阈值（同 field 语义 ≥0.85 且关键词交集 ≥1 → 判重复）
dedup_cosine_threshold = 0.85
# 判重关键词交集下限（≥1 个共同词参与判重）
dedup_keyword_min = 1
# 多事件互证语义余弦阈值（≥2 独立事件且语义 ≥0.7 且 valence 一致 → 覆盖）
corroboration_cosine_threshold = 0.7
# 事实卡片注入预算（字符上限，超预算保前部）
injection_budget_chars = 800
# 动态事实（volatile）时效半衰期（天，随事件时间衰减）
volatile_halflife_days = 30

# =========================================================
# 风格统计（表达层 A3）
# =========================================================
# 表达层层次 2：五维风格统计 + 显著性检验 + 自动规则生成，
# 规则文本注入「# 说话风格（表达层）」段落（手工 speaking_style 优先覆盖）。
# 关闭时整链路回退 v1.6（prompt 不含自动风格规则）。

[style]
# 风格统计总开关（默认 true —— 自动为主可配置）
# false = 不统计、不生成规则、不注入，prompt 与 v1.6 语义等价
enabled = true
# LLM 离线翻译增强开关（默认 true —— 增强为可选，LLM 不可用静默降级模板）
# false = 仅模板拼接（确定性可测、零 LLM 依赖）
auto_translate = true
# 小样本原文样例兜底开关（默认 true —— 样本不足时不生成自动规则，
# 但仍写入 SpeakingStyle 原文样例事实供画像/展示；false = 回退纯标注不写样例）
sample_fallback = true
# 关键词体系衔接开关（默认 true —— 存在 keyword_pool canonical 词表时
# 风格候选走词典增强；false 或词表为空 = 回退纯 bigram）
keyword_dict = true
# 样本量阈值 n_p（默认 200 条消息）
# 低于此值时标注"数据不足"，不生成规则文本、不注入
min_sample_count = 200
# 口癖词/话题词 Top-N（默认 10，文档范围 10~20）
top_n = 10
# 口癖词相对超频比阈值（默认 2.0：persona 频率 / 全局频率 > 2）
relative_boost_ratio = 2.0
# 显著项最小频次（默认 5 次：频次 ≥ 5 才参与显著性判定）
min_frequency = 5
# z 临界值（默认 2.0：|z| ≥ 2 判定统计显著）
z_critical = 2.0

# =========================================================
# 弱反馈环（H2，自我修正闭环）
# =========================================================
# S2 纠正 / S3 继续弱信号采集与校准：
# - 检测窗口内"上一条助手回复后用户发言"判弱信号，纠正前缀（不对/不是/应该说/其实）→ S2，
#   非纠正 → S3；间隔超窗口不计（沉默/中断≠负反馈）。
# - 写入 feedback_log（detail 脱敏，不含原文全文）。
# - auto_apply_weak_feedback 默认关闭：弱信号仅审计落库，不自动修改规则/画像（回归红线 5）。

[feedback]
# 弱反馈环总开关（默认 true —— 自动采集可配置；false = 不检测不写入，回退 v1.6）
enabled = true
# 弱反馈是否自动应用（默认 false）
# false = 仅写 feedback_log（审计），规则/画像零自动修改
# true = 检测到 S2 纠正/ S3 趋势异常时标记候选复审（不自动覆盖规则本身）
auto_apply_weak_feedback = false
# S2 纠正前缀检测窗口（毫秒，60s）：间隔 ≤ 此值且命中纠正前缀 → S2
correction_window_ms = 60000
# S3 继续发言检测窗口（毫秒，60s）：间隔 ≤ 此值且非纠正 → S3
continue_window_ms = 60000
# 同一目标重复反馈去重窗口（毫秒，30s）：窗口内同信号不重复写入
dedup_window_ms = 30000
# S3 趋势统计滑动窗口大小（默认 20 次）
s3_trend_window = 20
# S3 标记复审所需连续"继续"命中数（默认 5）
s3_continue_trigger = 5
# S3 标记复审所需随后的连续"不继续"数（默认 4）
s3_stop_trigger = 4

# =========================================================
# 注入协调预算（RAG 基座 + 四层注入的协调分配）
# =========================================================
# 将 RAG 摘要（memory_context 独立通道）与 system prompt 内四层注入
# （行为/知识/表达/脉络）纳入同一 token 池：超限时按 order 从低优先通道
# 开始整块丢弃，高优先内容完整保留，替代"各层独立预算 + 整条无差别截断"。
# 固定骨架（能力边界/角色层/当前时间）不入池，始终保留。
# 默认关闭：不启用时行为与既有版本逐字段等价（回归红线）。
# 注：本组默认值仅为机制起点，参数定稿在阶段二（M8 数据 Gate 之后）。

[injection_budget]
# 协调预算总开关（false = 关闭，走既有路径）
enabled = false
# RAG 摘要 + 四层注入合计 token 上限（固定骨架不计入池）
max_injection_tokens = 1000
# RAG 摘要独立 token 上限（0 = 不设独立上限，仅受总池约束）
max_rag_tokens = 0
# 超预算时的保留优先级（高优先在前，低优先先被整块丢弃）
# 可选通道：rag / behavior / knowledge / style / memory
order = ["rag", "behavior", "knowledge", "style", "memory"]

# =========================================================
# 层间证据去重与冲突仲裁
# =========================================================
# 注入装配前的跨层去重：同一事实在知识卡片/角色区/RAG 摘要/行为规则间
# 只注入一次，冲突按"手工 > 有引用 > 无引用"优先级保留。
# 默认关闭：关闭时沿用既有知识层引用级去重（行为与上一版本等价）。

[layer_dedup]
# 层间证据去重与冲突仲裁总开关（默认 false = 机制关闭，回退既有路径）
enabled = false

# =========================================================
# MCP 接入（外部 MCP 客户端挂载的记忆服务）
# =========================================================
# 桌面「设置 → MCP 接入」面板读写本组。挂载 MCP 后，被检索到的内容会随
# 对话发送给该客户端所使用的模型；原文块默认不出端，人格白名单可收紧。

[mcp]
# MCP 接入总开关（默认 false = 不提供工具能力，不影响桌面与 CLI）
enabled = false
# 是否允许外部对话回流写入（chat_ingest / chat_send 门禁）
allow_ingest = true
# 是否允许 MCP 侧触发封存与摘要生成（关闭时只写不封存）
allow_seal = true
# 可见人格白名单（["*"] = 全部可见）
allowed_personas = ["*"]
# 是否允许返回 utt 原文块（最高敏感层，默认关闭）
allow_raw_text = false
# 召回条目默认上限
max_items = 5
# 召回上下文文本默认预算（字符）
max_chars = 1200

# =========================================================
# 主动对话（系统主动发起消息）
# =========================================================
# Ramaria 会按调度节拍检查是否适合发起一次主动对话（问候 / 事件跟进等），
# 投递为桌面通知 + 应用内消息。本组为全部打扰控制参数，关闭总开关即完全停用。
# 说明: 主动对话仅随桌面装配生效；MCP / CLI 不主动发言。
# 命名说明: 本组与行为层规则参数 proactiveness（措辞主动程度）无语义关联。

[proactive]
# 主动对话总开关（默认开启）
enabled = true
# 调度检查间隔（秒）：决定"是否触发"的判定频率
check_interval_seconds = 300
# 距上次对话的最小空闲时长（小时）：避免打断进行中的交流
min_idle_hours = 4
# 每画像每日主动投递上限（条）
daily_limit = 3
# 全部人格合计每日主动投递上限（条）：0 = 不限
daily_total_limit = 0
# 免打扰时段（HH:MM-HH:MM，支持跨零点）
quiet_hours = "22:00-08:00"
# 两次主动投递之间的最短间隔（小时）
cooldown_hours = 8
# AI 判据开关（默认开启）：关闭后由算法打分直接决策
judge_enabled = true
# 判据调用节流间隔（小时）：两次判据调用之间的最短间隔
judge_interval_hours = 3
# 活跃时段软加权强度（0.0~1.0）：越高越偏向用户活跃时段
active_hours_weight = 0.8
# 活跃时段统计滚动窗口（天）
active_hours_window_days = 30
# 时段建模最少样本数：不足时不启用时段加权
active_hours_min_samples = 50
# 效价入权强度：越高情绪波动大的记忆越优先
valence_weight = 0.5
# 事件置信度门槛（0.0~1.0）：低于此值不进入主动选题
confidence_floor = 0.6
# 轻触达兜底候选权重（0.0~1.0）
light_touch_weight = 0.3
# 事件源显著性门槛（0.0~1.0）：低于此值的事件不进入主动选题
event_salience_threshold = 0.6
# 事件源统一时间窗（天）：仅事件结束时间在近 N 天内的事件参与选题
event_window_days = 14
# 未了结事件的负效价阈值（-1.0~0.0）：valence 低于此值视为负面情绪事件
unresolved_valence_threshold = -0.3
# 时间节点跟进点（天）：事件结束后第 N 天作为跟进时机
follow_up_days = 3
# 选题去重冷却窗口（小时）：同一选题键窗口内不复选（与投递冷却 cooldown_hours 无关）
topic_cooldown_hours = 24
# 连续未回应退避阈值（天）：达到后进入退避（降频 / 暂停）
silence_backoff_days = 3
# 首次启用宽限期（天）：期内不触发
startup_grace_days = 3

# =========================================================
# 图片理解（图片附件描述生成）
# =========================================================
# 导入聊天记录中的图片可经视觉模型生成描述并注入读取文本；需要当前对话模型
# 支持图片识别（显式声明），线上 provider 首次使用仍走既有隐私确认。
# 说明: 声明关闭时图片理解整体跳过，附件保留占位符不阻塞导入与记忆管线。

[vision]
# 当前对话模型是否支持图片识别（显式声明；关闭时图片理解整体跳过）
model_supports_vision = false
# 单次理解批次的图片上限（张）：0 = 不限
batch_limit = 0

# =========================================================
# 杂项（预留扩展位）
# =========================================================

[misc]
# 当前无配置项，为未来扩展预留
