# embedding-native：向量通道（原生 safetensors 推理）；与 CLI/桌面同一 feature 口径
ramaria-llm = { path = "../ramaria-llm", features = ["embedding-native"] }
tokio.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
uuid.workspace = true
chrono.workspace = true
sqlx.workspace = true
# 回流消息指纹（SHA-256 前 8 字节 hex，复用导入去重机制）
sha2.workspace = true
# L1 补扫宿主钩子（实现 ramaria-memory 的 L1RetryObserver 异步 trait）
async-trait.workspace = true
# 流式事件流类型（增量生成契约的宿主消费侧）
futures.workspace = true
