[package]
name = "ramaria-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
name = "ramaria_desktop_lib"
crate-type = ["lib"]

[[bin]]
name = "ramaria-desktop"
path = "src/main.rs"

[dependencies]
ramaria-core = { path = "../ramaria-core" }
# importer feature：QQ 聊天记录导入用例（解析 / L0 写入 / L1 批量生成 / 深度触发）
ramaria-service = { path = "../ramaria-service", features = ["importer"] }
# 导入侧过滤参数解析（ImportSide::parse_cli，与 CLI 同一枚举）
ramaria-importer = { path = "../ramaria-importer" }

# ---------- Tauri 2 ----------
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ---------- 异步 ----------
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
futures = { workspace = true }

# ---------- 工具 ----------
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
