<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
        http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self'; script-src 'self'; connect-src 'self' ipc: http://ipc.localhost https://ipc.localhost https://api.deepseek.com https://api.openai.com; img-src 'self' data:; font-src 'self'"
    />
    <title>Ramaria - 个人AI陪伴记忆系统</title>

    <!--
      始终以浅色模式启动，消除主题闪烁（FOUC）。
      必须在任何 CSS 加载前执行，不可 defer/async。
      外部化到 js/theme-init.js 以支持严格 CSP（无 'unsafe-inline'）。
    -->
    <script src="js/theme-init.js"></script>

    <!-- ── 字体声明 ── -->
    <link rel="stylesheet" href="fonts/fonts.css" />

    <!-- ── 设计系统 CSS ── -->
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/utilities.css" />
    <link rel="stylesheet" href="css/components.css" />

    <!-- Batch 5：视图样式 -->
    <link rel="stylesheet" href="css/views/setup.css" />
    <link rel="stylesheet" href="css/views/chat.css" />
    <link rel="stylesheet" href="css/views/memory.css" />
    <link rel="stylesheet" href="css/views/settings.css" />

    <!-- v1.1：导入视图样式 -->
    <link rel="stylesheet" href="css/views/import.css" />

    <!-- v1.1 Phase 6：人格管理视图样式 -->
    <link rel="stylesheet" href="css/views/persona.css" />

    <!-- Batch 6：动效系统（集中所有 keyframes，必须在视图 CSS 之后加载） -->
    <link rel="stylesheet" href="css/animations.css" />
</head>
<body>

    <!-- ═══════════════════════════════════════════════════════
         无障碍：跳转到主内容（仅聚焦时可见）
         ═══════════════════════════════════════════════════════ -->
    <a href="#content-area" class="skip-to-content" aria-label="跳转到主内容">
        跳转到主内容
    </a>

    <!-- ═══════════════════════════════════════════════════════
         SPA 根容器
         所有视图均在此容器内切换渲染
         ═══════════════════════════════════════════════════════ -->
    <div id="app">

        <!-- ── Sidebar（毛玻璃导航栏）── -->
        <nav class="sidebar" id="sidebar" role="navigation" aria-label="主导航">
            <!-- 品牌区 -->
            <div class="sidebar-brand">
                <div class="sidebar-brand-mark">
                    <div class="sidebar-brand-dots">
                        <div class="sidebar-brand-dot"></div>
                        <div class="sidebar-brand-dot"></div>
                    </div>
                    <span class="sidebar-brand-name">Ramaria</span>
                </div>
                <div class="sidebar-brand-version">v0.1.0</div>
            </div>

            <!-- 导航链接 -->
            <div class="sidebar-section">
                <div class="sidebar-section-label">功能</div>
                <ul class="sidebar-nav" role="menubar">
                    <li role="none">
                        <button class="sidebar-nav-link active"
                                data-view="chat"
                                role="menuitem"
                                aria-current="page">
                            <span class="sidebar-nav-icon" aria-hidden="true">💬</span>
                            <span>对话</span>
                        </button>
                    </li>
                    <li role="none">
                        <button class="sidebar-nav-link"
                                data-view="memory"
                                role="menuitem">
                            <span class="sidebar-nav-icon" aria-hidden="true">🧠</span>
                            <span>记忆</span>
                        </button>
                    </li>
                    <li role="none">
                        <button class="sidebar-nav-link"
                                data-view="persona"
                                role="menuitem">
                            <span class="sidebar-nav-icon" aria-hidden="true">👥</span>
                            <span>人格</span>
                        </button>
                    </li>
                    <li role="none">
                        <button class="sidebar-nav-link"
                                data-view="import"
                                role="menuitem">
                            <span class="sidebar-nav-icon" aria-hidden="true">📥</span>
                            <span>导入</span>
                        </button>
                    </li>
                    <li role="none">
                        <button class="sidebar-nav-link"
                                data-view="settings"
                                role="menuitem">
                            <span class="sidebar-nav-icon" aria-hidden="true">⚙️</span>
                            <span>设置</span>
                        </button>
                    </li>
                </ul>
            </div>

            <!-- 底部 -->
            <div class="sidebar-footer">
                <button class="sidebar-nav-link"
                        id="btn-toggle-theme"
                        title="切换深色/浅色主题"
                        aria-label="切换主题">
                    <span class="sidebar-nav-icon" aria-hidden="true">☀️</span>
                    <span>主题</span>
                </button>
            </div>
        </nav>

        <!-- ── 内容主区域 ── -->
        <main class="content-area" id="content-area">

            <!-- 内容区头部 -->
            <header class="content-header" id="content-header">
                <h2 class="content-header-title" id="content-title">对话</h2>
                <div class="content-header-actions" id="content-actions">
                    <!-- 视图特定操作按钮（由各视图注入） -->
                </div>
            </header>

            <!-- Degraded 警告条（默认隐藏） -->
            <div class="degraded-banner hidden" id="degraded-banner" role="alert">
                <span class="degraded-banner-icon" aria-hidden="true">⚠️</span>
                <span id="degraded-banner-text">部分功能不可用</span>
            </div>

            <!-- 视图容器（在此内部切换视图） -->
            <div class="view-container" id="view-container">

                <!--
                  所有视图默认隐藏，通过 .active 类切换（Router 管理）
                  - #view-setup     (全屏首次配置向导)  — Batch 5 已实现
                  - #view-progress  (全屏进度页)        — Router 管理
                  - #view-chat      (对话页)            — Batch 5 已实现
                  - #view-memory    (记忆查看页)        — Batch 5 已实现
                  - #view-settings  (设置页)            — Batch 5 已实现
                  - #view-error     (全屏错误页)        — Router 管理
                -->

                <!-- 对话视图（由 js/views/chat.js 动态渲染） -->
                <div class="view" id="view-chat" data-view="chat"></div>

                <!-- 记忆视图（由 js/views/memory.js 动态渲染） -->
                <div class="view" id="view-memory" data-view="memory"></div>

                <!-- 设置视图（由 js/views/settings.js 动态渲染） -->
                <div class="view" id="view-settings" data-view="settings"></div>

                <!-- 人格管理视图（v1.1 Phase 6 新增，由 js/views/persona.js 动态渲染） -->
                <div class="view" id="view-persona" data-view="persona"></div>

                <!-- 导入视图（v1.1 新增，由 js/views/import.js 动态渲染） -->
                <div class="view" id="view-import" data-view="import"></div>

                <!-- 首次配置全屏视图（由 js/views/setup.js 动态渲染） -->
                <div class="view view--fullscreen" id="view-setup" data-view="setup"></div>

                <!-- 进度页全屏视图 -->
                <div class="view view--fullscreen" id="view-progress" data-view="progress" role="status" aria-live="polite">
                    <div class="text-center text-tertiary">
                        <div id="progress-spinner" class="view-progress-spinner">
                            <div class="spinner-ring spinner-ring--lg" aria-label="加载中"></div>
                        </div>
                        <div class="text-xl font-medium mb-2" id="progress-title">正在处理...</div>
                        <div class="text-sm" id="progress-desc">请稍候</div>
                    </div>
                </div>

                <!-- 错误全屏视图 -->
                <div class="view view--fullscreen" id="view-error" data-view="error" role="alert" aria-live="assertive">
                    <div class="text-center view-error-box"> 
                        <div class="view-error-icon">❌</div>
                        <div class="text-xl font-semibold text-pink mb-3" id="error-title">严重错误</div>
                        <div class="text-base text-secondary" id="error-detail">应用遇到不可恢复的错误，请查看日志后重启。</div>
                    </div>
                </div>

            </div><!-- /view-container -->

            <!-- 底部状态栏 -->
            <div class="status-bar" id="status-bar">
                <div class="status-bar-item">
                    <div class="status-bar-dot ready" id="status-indicator-dot"></div>
                    <span id="status-indicator-text">就绪</span>
                </div>
                <div class="status-bar-item">
                    <span id="status-session-info"></span>
                </div>
            </div>

        </main><!-- /content-area -->

    </div><!-- /#app -->

    <!-- ═══════════════════════════════════════════════════════
         JavaScript 模块加载
         ═══════════════════════════════════════════════════════ -->

    <!-- Tauri IPC 桥接层（Batch 1 产出，必须最先加载） -->
    <script src="js/tauri-bridge.js"></script>

    <!-- Batch 3：状态管理 + 通信层 + 路由 -->
    <script src="js/store.js"></script>
    <script src="js/api.js"></script>
    <script src="js/router.js"></script>

    <!-- Batch 3：应用入口（重构版，使用 Store/Api/Router） -->
    <script src="js/app.js"></script>

    <!-- Batch 4：通用组件库 -->
    <script src="js/components/toast.js"></script>
    <script src="js/components/modal.js"></script>
    <script src="js/components/skeleton.js"></script>

    <!-- Batch 4：工具函数 -->
    <script src="js/utils/markdown.js"></script>
    <script src="js/utils/format.js"></script>

    <!-- Batch 5：消息气泡组件 -->
    <script src="js/components/message-bubble.js"></script>

    <!-- Phase 1.1.1：非阻塞进度条（嵌入模型下载 / 索引重建） -->
    <script src="js/components/progress-bar.js"></script>

    <!-- Batch 5：视图模块 -->
    <script src="js/views/setup.js"></script>
    <script src="js/views/chat.js"></script>
    <script src="js/views/memory.js"></script>
    <script src="js/views/settings.js"></script>

    <!-- v1.1：导入视图模块 -->
    <script src="js/views/import.js"></script>

    <!-- v1.1 Phase 6：人格管理视图模块 -->
    <script src="js/views/persona.js"></script>

</body>
</html>
