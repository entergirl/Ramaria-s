[package]
name = "ramaria-llm"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
# 启用原生 safetensors 嵌入模型支持（candle 推理引擎）
# 支持 bge-small-zh-v1.5（BERT 架构）和 Qwen3-Embedding-0.6B（LLaMA 架构）
embedding-native = [
    "dep:candle-core",
    "dep:candle-nn",
    "dep:candle-transformers",
    "dep:safetensors",
    "dep:tokenizers",
]
# 启用 candle CUDA 后端（GPU 向量推理，RTX 4060 等）。
# 依赖系统安装 CUDA toolkit 与 nvcc；未启用时 device=cuda/auto 自动回退 CPU。
# 需与 embedding-native 一起启用。
cuda = [
    "embedding-native",
    "candle-core/cuda",
    "candle-nn/cuda",
    "candle-transformers/cuda",
]
# 旧 ONNX 路径（保留兼容，Phase 2 后移除）
embedding-onnx = ["dep:ort", "dep:tokenizers", "dep:ndarray"]

[dependencies]
ramaria-core = { path = "../ramaria-core" }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
futures.workspace = true
async-trait.workspace = true
uuid.workspace = true
bytes = "1"
sha2.workspace = true

# Embedding 支持（可选 feature — 推荐使用 embedding-native）
candle-core = { workspace = true, optional = true }
candle-nn = { workspace = true, optional = true }
candle-transformers = { workspace = true, optional = true }
safetensors = { workspace = true, optional = true }
tokenizers = { workspace = true, optional = true }
ort = { workspace = true, optional = true }
ndarray = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
windows.workspace = true

# 仅用于集成测试（含 D-P 聚类参数摸底，见 tests/dp_cluster_tuning.rs）。
# ramaria-memory 提供行为聚类（density_cluster/fused_similarity/vectorize），
# ramaria-storage 提供只读事件访问；均在 dev 构建拉入，不影响生产依赖。
[dev-dependencies]
ramaria-memory = { path = "../ramaria-memory" }
ramaria-storage = { path = "../ramaria-storage" }
sqlx.workspace = true

