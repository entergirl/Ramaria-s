[package]
name = "ramaria-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "ramaria"
path = "src/main.rs"

[dependencies]
ramaria-app = { path = "../ramaria-app" }
ramaria-core = { path = "../ramaria-core" }
ramaria-memory = { path = "../ramaria-memory" }
ramaria-storage = { path = "../ramaria-storage" }
ramaria-llm = { path = "../ramaria-llm", features = ["embedding-native"] }
ramaria-importer = { path = "../ramaria-importer" }
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
anyhow.workspace = true
chrono.workspace = true
uuid.workspace = true
futures.workspace = true
sqlx.workspace = true
windows = { workspace = true, features = ["Win32_System_Console"] }

[dev-dependencies]
async-trait.workspace = true
tokio.workspace = true
reqwest = { workspace = true, features = ["json"] }
