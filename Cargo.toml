[workspace]
resolver = "3"
members = [
    "crates/ramaria-core",
    "crates/ramaria-storage",
    "crates/ramaria-memory",
    "crates/ramaria-llm",
    "crates/ramaria-app",
    "crates/ramaria-cli",
    "crates/ramaria-desktop",
    "crates/ramaria-importer",
]

[workspace.package]
version = "1.3.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
# ---------- 异步运行时 ----------
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }

# ---------- 序列化 ----------
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# ---------- 数据库 ----------
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate", "uuid"] }

# ---------- 工具 ----------
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }

# ---------- 异步抽象（纯类型，无 I/O 依赖）----------
async-trait = "0.1"
futures = "0.3"

# ---------- 网络 ----------
reqwest = { version = "0.12", features = ["json", "stream"] }

# ---------- CLI ----------
clap = { version = "4", features = ["derive"] }

# ---------- 密钥管理 ----------
windows = { version = "0.58", features = [
    "Win32_Security_Credentials",
    "Win32_Foundation",
] }

candle-core = "0.10"
candle-nn = "0.10"
candle-transformers = "0.10"
safetensors = "0.7"
tokenizers = "0.22"
ort = { version = "2.0.0-rc.12", features = ["download-binaries"] }
ndarray = "0.16"

# candle 继承依赖
candle = { package = "candle-core", version = "0.10" }
byteorder = "1"
fancy-regex = "0.18"
num-traits = "0.2"
rand = "0.9"
rayon = "1"
serde_plain = "1"
accelerate-src = "0.3"
intel-mkl-src = "0.8"
candle-flash-attn = "0.10"

# ---------- 工具 ----------
sha2 = "0.10"

# ---------- Desktop ----------
tauri = "2"
tauri-build = "2"
