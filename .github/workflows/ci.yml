# Ramaria Rust CI
# 规则：
#   - Windows 编译 + 单元测试（v1.0 首发 Windows，macOS/Linux 延后）
#   - 不跑真实 LLM，不下 embedding 模型，不打包 Tauri
#   - 阻塞条件：cargo build / test / clippy / fmt 全部通过；coverage 行覆盖率低于阈值即失败
#   - 非阻塞条件：cargo-deny / cargo-audit 仅报告，不阻塞 PR

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-and-test:
    name: Build & Test (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-cargo-${{ hashFiles('Cargo.toml') }}
          restore-keys: windows-cargo-

      - name: Build
        run: cargo build --workspace

      - name: Test
        run: cargo test --workspace

      - name: Lint (clippy)
        run: cargo clippy --workspace -- -D warnings

      - name: Format check
        run: cargo fmt --all --check

  # ---- 覆盖率报告（阈值阻塞） ----
  # 使用 cargo-llvm-cov 生成行覆盖率报告，行覆盖率低于阈值即失败（拦截覆盖率回退）。
  # 阈值口径：全局行覆盖率下限 80%；模块级目标（新模块 ≥85% / 重度修改模块 ≥80%）
  # 见 docs/dev-2.0/v2.0-checklist.md「覆盖率目标」，按发布前人工核验执行。
  # 仅适用于 Windows（llvm-tools-preview 组件可用）。
  coverage:
    name: Coverage (llvm-cov)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-cov-${{ hashFiles('Cargo.toml') }}
          restore-keys: windows-cov-

      - name: Run coverage
        run: cargo llvm-cov --workspace --summary-only --lcov --output-path lcov.info --fail-under-lines 80
        # 注：--lcov --output-path 生成 lcov 格式报告，可上传到 Codecov/Coveralls
        # --fail-under-lines 80：全局行覆盖率 <80% 时本步骤失败（拦截覆盖率回退）

      - name: Show coverage summary
        run: cargo llvm-cov --workspace --summary-only

  # ---- 依赖许可证检查（非阻塞） ----
  # 使用 cargo-deny 检查依赖树的许可证兼容性。
  # 拒绝列表: 禁止 GPL/AGPL 等强制开源的许可证（Ramaria 独立分发）。
  cargo-deny:
    name: License Check (cargo-deny)
    runs-on: ubuntu-latest
    continue-on-error: true  # 非阻塞
    strategy:
      matrix:
        checks:
          - advisories
          - bans licenses sources

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check ${{ matrix.checks }}
          # 注: 首次运行可能缺少 deny.toml 配置文件，cargo-deny 会使用内置默认规则。
          # 后续可在仓库根目录添加 deny.toml 以自定义许可证策略。

  # ---- 安全漏洞审计（非阻塞） ----
  # 使用 cargo-audit 检查已知的 RustSec 安全漏洞。
  security-audit:
    name: Security Audit (cargo-audit)
    runs-on: ubuntu-latest
    continue-on-error: true  # 非阻塞：发现漏洞时仅报告，由项目负责人评估

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Run security audit
        run: cargo audit
        # 注：若有已知漏洞，此步骤会输出 CVE 编号和受影响版本，
        # 但因 continue-on-error: true，不会阻塞 CI。
