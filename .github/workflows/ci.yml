# Ramaria Rust CI
# 规则：
#   - Windows 编译 + 单元测试（v1.0 首发 Windows，macOS/Linux 延后）
#   - 不跑真实 LLM，不下 embedding 模型，不打包 Tauri
#   - 阻塞条件：cargo build / test / clippy / fmt 全部通过

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-and-test:
    name: windows-latest
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-cargo-${{ hashFiles('Cargo.toml') }}
          restore-keys: windows-cargo-

      - name: Build
        run: cargo build --workspace

      - name: Test
        run: cargo test --workspace

      - name: Lint (clippy)
        run: cargo clippy --workspace -- -D warnings

      - name: Format check
        run: cargo fmt --all --check
