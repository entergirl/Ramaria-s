# Ramaria Rust CI
# job 集合：build-and-test（Windows）/ coverage（Windows）/ structure-check（Ubuntu，秒级）
# 规则：
#   - Windows 编译 + 单元测试（v1.0 首发 Windows，macOS/Linux 延后）
#   - 不跑真实 LLM，不下 embedding 模型，不打包 Tauri
#   - 阻塞条件：cargo build / test / clippy / fmt 全部通过；coverage 行覆盖率低于阈值即失败；
#     structure-check 结构红线达标（脚本非零退出码即失败）
#   - deny.toml 保留在仓库但无 CI 消费（License Check / Security Audit 两个 job 已移除，待恢复）

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-and-test:
    name: Build & Test (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-cargo-${{ hashFiles('Cargo.toml') }}
          restore-keys: windows-cargo-

      - name: Build
        run: cargo build --workspace

      - name: Test
        run: cargo test --workspace

      - name: Lint (clippy)
        run: cargo clippy --workspace -- -D warnings

      - name: Format check
        run: cargo fmt --all --check

  # ---- 覆盖率报告（阈值阻塞） ----
  # 使用 cargo-llvm-cov 生成行覆盖率报告，行覆盖率低于阈值即失败（拦截覆盖率回退）。
  # 阈值口径：全局行覆盖率下限 80%；模块级目标（新模块 ≥85% / 重度修改模块 ≥80%）
  # 见 docs/dev-2.0/v2.0-checklist.md「覆盖率目标」，按发布前人工核验执行。
  # 仅适用于 Windows（llvm-tools-preview 组件可用）。
  coverage:
    name: Coverage (llvm-cov)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-cov-${{ hashFiles('Cargo.toml') }}
          restore-keys: windows-cov-

      - name: Run coverage
        run: cargo llvm-cov --workspace --summary-only --lcov --output-path lcov.info --fail-under-lines 80
        # 注：--lcov --output-path 生成 lcov 格式报告，可上传到 Codecov/Coveralls
        # --fail-under-lines 80：全局行覆盖率 <80% 时本步骤失败（拦截覆盖率回退）

      - name: Show coverage summary
        run: cargo llvm-cov --workspace --summary-only

  # ---- 结构自检（阻塞） ----
  # 秒级：纯文件遍历（scripts/check_structure.py），对照文件粒度红线（生产 ≤700 / 测试 ≤1200 /
  # mod.rs·lib.rs ≤500；例外见 scripts/structure-exemptions.toml），输出阻断 / 建议 / 例外清单。
  # 退出码即结论：0 = 通过 / 1 = 存在阻断项 / 2 = 环境或清单错误；非零即失败，无需额外包装。
  structure-check:
    name: Structure Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run structure check
        run: python scripts/check_structure.py
