name: "🔧 使用求助"
description: "不知道怎么用？来问我！"
title: "[Help] "
labels: ["question", "help wanted"]
body:
  - type: markdown
    attributes:
      value: |
        ## 👋 你好！

        这个模板用于解决：

        - 📖 不知道某个功能怎么配置/使用
        - 🔌 连接 LM Studio / DeepSeek / OpenAI 遇到困难
        - 💭 不确定某个操作的正确方式
        - ⚙️ 安装或首次配置问题

        **求助前请先查阅：**
        - [ ] [桌面使用指南](https://github.com/entergirl/Ramaria-s/blob/main/docs/desktop-user-guide.md)
        - [ ] [CLI 使用指南](https://github.com/entergirl/Ramaria-s/blob/main/docs/cli-user-guide.md)
        - [ ] [已有 issue](https://github.com/entergirl/Ramaria-s/issues)

  - type: dropdown
    id: category
    attributes:
      label: "📂 问题分类"
      options:
        - "安装 / 首次配置向导"
        - "连接 LM Studio"
        - "连接 DeepSeek"
        - "连接 OpenAI"
        - "对话功能使用"
        - "记忆系统（L1/L2/L3）"
        - "人格画像 / 人格管理"
        - "CLI 使用"
        - "系统托盘 / 通知"
        - "数据导出"
        - "配置修改"
        - "其他"
    validations:
      required: true

  - type: textarea
    id: what-want
    attributes:
      label: "🎯 想要达成什么？"
      placeholder: |
        描述你希望实现的目标。

        例如：
        我想在 CLI 中切换对话的人格，但不确定用什么命令。
    validations:
      required: true

  - type: textarea
    id: what-tried
    attributes:
      label: "🔍 尝试过什么？"
      placeholder: |
        描述已经尝试的步骤。

        例如：
        1. 运行 `ramaria persona show` 看到可用的 uid
        2. 尝试 `ramaria ask "你好" --persona rama-0001`
        3. 不确定参数写法是否正确
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: "🤔 遇到了什么问题？"
      placeholder: |
        如果没有报错但不符合预期，描述具体现象。

        如果有报错，粘贴错误信息。
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: "💻 操作系统"
      options:
        - Windows 11
        - Windows 10
        - Linux
        - macOS
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: "📦 Ramaria 版本"
      placeholder: "v1.0.0"

  - type: dropdown
    id: entry
    attributes:
      label: "🖥️ 使用入口"
      options:
        - "桌面应用（Tauri）"
        - "CLI"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: "📋 相关日志"
      description: "来自 %APPDATA%\\Ramaria\\logs\\ramaria.log 或终端输出"
      render: shell
      placeholder: |
        粘贴相关日志片段

  - type: checkboxes
    id: checklist
    attributes:
      label: "✅ 已确认"
      options:
        - label: "已阅读桌面使用指南或 CLI 使用指南"
        - label: "应用已成功安装且完成首次配置"
        - label: "如使用 LM Studio：LM Studio 已启动并加载模型"
