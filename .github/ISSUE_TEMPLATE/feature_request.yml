name: "💡 功能建议"
description: "有好的想法？一起来讨论！"
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        ## 👋 你好！

        感谢你的建议！提交前请确认：

        - [ ] 搜索过已有 [issue](https://github.com/entergirl/Ramaria-s/issues)
        - [ ] 了解 [v1.0 功能范围](https://github.com/entergirl/Ramaria-s#readme)（v1.1+ 延后功能见下方说明）

        > **v1.1+ 已规划的延后功能：** QQ/微信导入、Ollama/Claude 后端、多角色 GUI、MCP bridge、自动更新、移动端 — 这些已在路线图中，无需重复提 issue。

  - type: dropdown
    id: os
    attributes:
      label: "💻 操作系统"
      options:
        - Windows 11
        - Windows 10
        - Linux
        - macOS
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: "📦 Ramaria 版本"
      placeholder: "v1.0.0"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: "🎯 想要解决什么问题？"
      placeholder: |
        描述你遇到的问题或使用痛点。

        例如：
        目前只能通过系统托盘隐藏窗口，希望支持全局快捷键快速呼出/隐藏。
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: "💡 建议的解决方案"
      placeholder: |
        描述你希望的功能或改进方向。

        例如：
        支持 `Ctrl+Shift+R` 全局快捷键，在任意应用中使用时快速呼出 Ramaria 对话窗口。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: "🔄 是否有替代方案？"
      placeholder: |
        你考虑过其他实现方式吗？

  - type: dropdown
    id: scope
    attributes:
      label: "📐 涉及范围"
      options:
        - "桌面应用（Tauri 前端）"
        - "CLI"
        - "记忆系统 / 检索"
        - "性格推断管线"
        - "LLM 后端接入"
        - "安装 / 配置 / 文档"
        - "其他"

  - type: checkboxes
    id: context
    attributes:
      label: "📎 附加信息"
      options:
        - label: "这与个人隐私/数据安全相关"
        - label: "我愿意参与这个功能的开发"
